services:
  nominatim:
    image: mediagis/nominatim:5.3@sha256:7923a8e67197fc6d4f4ecb7c0e8bbedffeddcfdf4519596fe946e46a28f5a9f8
    container_name: horasard-nominatim
    restart: unless-stopped
    shm_size: 4gb
    cpus: 5
    mem_limit: 20g
    environment:
      PBF_URL: https://download.geofabrik.de/asia/thailand-latest.osm.pbf
      REPLICATION_URL: https://download.geofabrik.de/asia/thailand-updates/
      UPDATE_MODE: continuous
      REPLICATION_UPDATE_INTERVAL: "86400"
      REPLICATION_RECHECK_INTERVAL: "900"
      IMPORT_STYLE: admin
      REVERSE_ONLY: "true"
      IMPORT_WIKIPEDIA: "false"
      THREADS: "4"
      GUNICORN_WORKERS: "2"
      WARMUP_ON_STARTUP: "true"
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:?set NOMINATIM_PASSWORD in .env}
      POSTGRES_SHARED_BUFFERS: 2GB
      POSTGRES_MAINTENANCE_WORK_MEM: 4GB
      POSTGRES_AUTOVACUUM_WORK_MEM: 1GB
      POSTGRES_WORK_MEM: 32MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 16GB
      POSTGRES_MAX_WAL_SIZE: 2GB
      POSTGRES_CHECKPOINT_TIMEOUT: 30min
    volumes:
      - nominatim-data:/var/lib/postgresql/16/main
    networks:
      - kindgo_default

volumes:
  nominatim-data:
    name: horasard-nominatim-data

networks:
  kindgo_default:
    external: true
