# HoraSard Thailand reverse geocoder — deploy as a Coolify "Docker Compose"
# resource on HoraSard's own server. Internal only: no published ports and no
# public domain; the HoraSard app reaches it over the Coolify network.
services:
  nominatim:
    image: mediagis/nominatim:5.3@sha256:7923a8e67197fc6d4f4ecb7c0e8bbedffeddcfdf4519596fe946e46a28f5a9f8
    restart: unless-stopped
    shm_size: 1gb
    # Admin-only, reverse-only Thailand import is small. These caps leave the
    # app and its PostgreSQL headroom on a shared server; raise them only after
    # checking `free -g` / `nproc` on the host.
    cpus: 2
    mem_limit: 6g
    environment:
      PBF_URL: https://download.geofabrik.de/asia/thailand-latest.osm.pbf
      REPLICATION_URL: https://download.geofabrik.de/asia/thailand-updates/
      UPDATE_MODE: continuous
      REPLICATION_UPDATE_INTERVAL: "86400"
      REPLICATION_RECHECK_INTERVAL: "900"
      IMPORT_STYLE: admin
      REVERSE_ONLY: "true"
      IMPORT_WIKIPEDIA: "false"
      THREADS: "2"
      GUNICORN_WORKERS: "2"
      WARMUP_ON_STARTUP: "true"
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:?set NOMINATIM_PASSWORD in Coolify environment variables}
      POSTGRES_SHARED_BUFFERS: 1GB
      POSTGRES_MAINTENANCE_WORK_MEM: 1GB
      POSTGRES_AUTOVACUUM_WORK_MEM: 512MB
      POSTGRES_WORK_MEM: 32MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 4GB
      POSTGRES_MAX_WAL_SIZE: 2GB
      POSTGRES_CHECKPOINT_TIMEOUT: 30min
    volumes:
      - nominatim-data:/var/lib/postgresql/16/main

volumes:
  nominatim-data:
