# Place in the shared nginx http context after the Thailand import is healthy.
limit_req_zone $binary_remote_addr zone=horasard_geo_per_ip:10m rate=2r/s;
limit_req_zone $server_name zone=horasard_geo_global:10m rate=10r/s;

server {
    listen 443 ssl;
    http2 on;
    server_name nominatim.187.77.155.129.nip.io;

    ssl_certificate     /etc/letsencrypt/live/nominatim.187.77.155.129.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nominatim.187.77.155.129.nip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /reverse {
        limit_req zone=horasard_geo_per_ip burst=4 nodelay;
        limit_req zone=horasard_geo_global burst=20 nodelay;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $nominatim_up horasard-nominatim:8080;
        proxy_pass http://$nominatim_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    location / { return 404; }
}
