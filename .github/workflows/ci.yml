name: CI

# Remote gate. If GitHub Actions is billing-locked, use the local stand-in:
#   npm run ci            # typecheck · lint · unit
#   npm run hooks:install # pre-push runs the same check
# See README → "CI while GitHub Actions is unavailable".

on:
  push:
    branches: [main]
  pull_request:

# A newer push supersedes an in-flight run on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gate: types, lint, unit tests. No database — nothing here talks to one.
  check:
    name: typecheck · lint · unit
    runs-on: ubuntu-latest
    env:
      # config/env.ts validates at import time. These are never connected to;
      # they only have to satisfy the schema.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-placeholder-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npx eslint src e2e
      - run: npx vitest run

  admin-regression:
    name: admin expiry + 2FA UI · PostgreSQL regression
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: hora_admin_filter_test_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d hora_admin_filter_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/hora_admin_filter_test_ci
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/hora_admin_filter_test_ci
      AUTH_SECRET: ci-placeholder-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:ui:admin
      - run: npm run test:integration:admin-users
      - run: npm run test:e2e:free-expiry
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-expiry-screenshots
          path: output/admin-ui-tests/
          retention-days: 7

  # No production DB or saved user credentials: migrate and seed a local fixture.
  e2e:
    name: e2e (chat flow)
    runs-on: ubuntu-latest
    needs: [check, admin-regression]
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: hora_chat_test_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d hora_chat_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/hora_chat_test_ci
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/hora_chat_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:e2e:chat
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-playwright-report
          path: |
            playwright-report/
            test-results/
            output/chat-ui-tests/
          retention-days: 7
